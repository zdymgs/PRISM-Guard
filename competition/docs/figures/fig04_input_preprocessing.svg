<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="780" viewBox="0 0 1800 780"><title>Input construction and preprocessing</title><desc>Fresh trial-local input construction. IR pose/ROI extraction defines scene/person/workspace clips in overlapping early/late windows. Selected visual times drive skeleton sampling and IMU bins, retaining masks and quality. Depth_Color frame indices support the common-frame contract, not a deployed depth image branch. Cache rebuilding uses current raw inputs. Conditional recovery is limited by available timelines/modalities; incomplete outputs are not complete reproduction. All sensor thumbnails and timelines are schematic.</desc><rect x="0" y="0" width="1800" height="780" rx="5" fill="#FFFFFF" stroke="none" stroke-width="1.7"/><text x="40" y="43.0" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" font-style="normal" text-anchor="start" fill="#263342">(a) Raw trial &amp; checks</text><polyline points="40,63 400,63" fill="none" stroke="#D8DEE5" stroke-width="1.4" stroke-linejoin="round"/><text x="465" y="43.0" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" font-style="normal" text-anchor="start" fill="#263342">(b) Aligned construction</text><polyline points="465,63 1335,63" fill="none" stroke="#D8DEE5" stroke-width="1.4" stroke-linejoin="round"/><text x="1400" y="43.0" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" font-style="normal" text-anchor="start" fill="#263342">(c) Student inputs</text><polyline points="1400,63 1760,63" fill="none" stroke="#D8DEE5" stroke-width="1.4" stroke-linejoin="round"/><rect x="465" y="227" width="865" height="118" rx="0" fill="#F5F8FC" stroke="none" stroke-width="1.7"/><rect x="465" y="378" width="865" height="116" rx="0" fill="#F6F9F5" stroke="none" stroke-width="1.7"/><rect x="465" y="542" width="865" height="115" rx="0" fill="#FFFAF2" stroke="none" stroke-width="1.7"/><text x="60" y="125.0" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" font-style="normal" text-anchor="start" fill="#263342">test.csv → raw trial</text><rect x="60" y="159" width="300" height="181" rx="1" fill="#FFFFFF" stroke="#D8DEE5" stroke-width="1.7"/><rect x="78" y="174" width="13" height="13" rx="0" fill="#3972A4" stroke="none" stroke-width="1.7"/><text x="110" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" font-style="normal" text-anchor="start" fill="#263342">IR frames</text><rect x="78" y="213" width="13" height="13" rx="0" fill="#528361" stroke="none" stroke-width="1.7"/><text x="110" y="235.0" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" font-style="normal" text-anchor="start" fill="#263342">Skeleton JSON</text><rect x="78" y="252" width="13" height="13" rx="0" fill="#A87531" stroke="none" stroke-width="1.7"/><text x="110" y="274.0" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" font-style="normal" text-anchor="start" fill="#263342">IMU records</text><rect x="78" y="291" width="13" height="13" rx="0" fill="#697784" stroke="none" stroke-width="1.7"/><text x="110" y="313.0" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" font-style="normal" text-anchor="start" fill="#263342">Depth_Color IDs</text><rect x="55" y="384" width="305" height="95" rx="5" fill="#F3F5F7" stroke="#697784" stroke-width="1.7"/><text x="207.5" y="423.4" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" font-style="normal" text-anchor="middle" fill="#263342">Availability &amp;</text><text x="207.5" y="459.4" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" font-style="normal" text-anchor="middle" fill="#263342">timeline checks</text><polyline points="210,340 210,384" fill="none" stroke="#5C6672" stroke-width="2" stroke-linejoin="round"/><polygon points="210,384 215.3,373.0 204.7,373.0" fill="#5C6672" stroke="none" stroke