<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="190" viewBox="0 0 1100 190"><title>PRISM offline teacher and local-input student</title><rect width="1100" height="190" fill="white"/><g font-family="sans-serif" font-size="16" text-anchor="middle"><rect x="15" y="25" width="215" height="65" rx="8" fill="#edf2fa" stroke="#2f5597"/><text x="122" y="53">Private content posteriors</text><text x="122" y="75">and protocol metadata</text><rect x="290" y="25" width="220" height="65" rx="8" fill="#fbf5e3" stroke="#8f6d12"/><text x="400" y="53">PRISM offline refinement</text><text x="400" y="75">and frozen targets</text><rect x="570" y="25" width="215" height="65" rx="8" fill="#eaf3e4" stroke="#548235"/><text x="677" y="53">Student distillation</text><text x="677" y="75">from common C0</text><rect x="850" y="25" width="235" height="65" rx="8" fill="#edf2fa" stroke="#2f5597"/><text x="967" y="53">PRISM-D deployment</text><text x="967" y="75">local sensors only</text><path d="M230 57H285M510 57H565M785 57H845" fill="none" stroke="#333" stroke-width="2"/><text x="550" y="140" font-size="15" fill="#555">Relations enter offline targets; deployment consumes one recording at a time.</text></g></svg>